# Barlas gömülü uygulamalar (apps/) — Alias + ortak giriş kapısı.
# Compose bu dosyayı /etc/apache2/conf-enabled/zz-apps.conf olarak mount eder;
# değişiklik imaj yeniden kurmadan "docker compose restart web" ile yürür.
#
# /qr      → ikinci CodeIgniter uygulaması; ortak girişe /patron köprüsüyle
#            bağlıdır (go-qr.php → /qr/sso), kendi /login'i yedek kapıdır.
# /fatura  → saf PHP; guard.php prepend'i ile Shield hesabına kilitli.
# /teklif  → saf PHP + statik SPA; .php'ler prepend ile, statikler
#            apps/teklif/gate.php üzerinden korunur (offers/ müşteri verisi).
# /patron  → ortak giriş + üç kartlı hub; bekçi kapsamı DIŞINDA kalmak zorunda.
#
# php_admin_value bilerek: .htaccess'ten geçersiz kılınamaz.

Alias /patron /var/www/html/apps/_shared/auth/public
Alias /qr /var/www/html/apps/qr/public
Alias /fatura /var/www/html/apps/fatura
Alias /teklif /var/www/html/apps/teklif

<Directory /var/www/html/apps/_shared/auth/public>
    Require all granted
    AllowOverride None
</Directory>

<Directory /var/www/html/apps/qr/public>
    Require all granted
    AllowOverride All
    Options FollowSymLinks
</Directory>

<Directory /var/www/html/apps/fatura>
    Require all granted
    AllowOverride None
    php_admin_value auto_prepend_file /var/www/html/apps/_shared/auth/guard.php
</Directory>

# Gerçek fatura kayıtları (data/faturalar.json) statik dosya olarak sızmasın.
<Directory /var/www/html/apps/fatura/data>
    Require all denied
</Directory>

<Directory /var/www/html/apps/teklif>
    Require all granted
    AllowOverride All
    php_admin_value auto_prepend_file /var/www/html/apps/_shared/auth/guard.php
</Directory>
