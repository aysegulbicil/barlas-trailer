name: Deploy to Hostinger

# Deploy automatically on every push to the production branch.
# Manual runs are also possible from the Actions tab (workflow_dispatch).
on:
  push:
    branches: [fable-test]
  workflow_dispatch:

# Never let two deploys touch the server at the same time. A newer push waits
# for the in-flight deploy to finish instead of racing it.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH deploy
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          PANEL_ADMIN_EMAIL: ${{ secrets.PANEL_ADMIN_EMAIL }}
          PANEL_ADMIN_PASSWORD: ${{ secrets.PANEL_ADMIN_PASSWORD }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          port: ${{ secrets.SSH_PORT }}
          # Preferred: SSH private key. If you use a password instead, delete the
          # `key:` line and uncomment `password:` below (+ set the secret).
          key: ${{ secrets.SSH_KEY }}
          # password: ${{ secrets.SSH_PASSWORD }}

          command_timeout: 15m

          # Forwarded to deploy.sh for the /patron + /panel admin bootstrap.
          # Optional: when the secrets are unset the bootstrap step is skipped.
          envs: PANEL_ADMIN_EMAIL,PANEL_ADMIN_PASSWORD

          # The repo is already cloned on the server; we just run its deploy.sh.
          script: |
            set -euo pipefail
            cd "$HOME/domains/barlastrailer.com/barlas-trailer"
            git fetch --prune origin fable-test
            # -B resets the local branch to the remote tip even from a detached
            # HEAD, guaranteeing deploy.sh is present before we invoke it.
            git checkout -B fable-test origin/fable-test
            bash deploy.sh
